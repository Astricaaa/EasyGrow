<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro • EasyGrow Consola de Negocios</title>
  <link rel="icon" type="image/png" href="easygrow-logo-badge.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/loader.css">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(17, 17, 17, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17, 17, 17, 0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      border: 1.5px solid #111111;
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 50px rgba(17, 17, 17, 0.08);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-title {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .brand-title span {
      color: var(--accent-1);
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(31, 168, 102, 0.10);
      border: 1px solid rgba(31, 168, 102, 0.35);
      color: var(--accent-1);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      background: #F2F3F0;
      border: 1px solid #D7D7D3;
      border-radius: 8px;
      padding: 0.25rem;
      margin-bottom: 1.75rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.65rem 0.5rem;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .tab-btn.active {
      background: #111111;
      color: #FFFFFF;
      border: 1px solid #111111;
      box-shadow: 0 2px 6px rgba(17, 17, 17, 0.12);
    }

    /* Forms */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #F8F8F6;
      border: 1px solid #C8C8C2;
      border-radius: 6px;
      color: #111111;
      font-size: 0.92rem;
      transition: all var(--transition-fast);
    }

    .form-control:focus {
      outline: none;
      background: #FFFFFF;
      border-color: var(--accent-1);
      box-shadow: 0 0 0 3px rgba(31, 168, 102, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: #111111;
      color: #FFFFFF;
      border: 1.5px solid #111111;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn-submit:hover {
      background: var(--accent-1);
      border-color: var(--accent-1);
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(31, 168, 102, 0.28);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Quick Fill Pills */
    .demo-accounts {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px dashed #D7D7D3;
      text-align: center;
    }

    .demo-accounts-title {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }

    .demo-pills {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .demo-pill {
      background: #F8F8F6;
      border: 1px solid #D7D7D3;
      color: #111111;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .demo-pill:hover {
      border-color: var(--accent-1);
      color: var(--accent-1);
      background: rgba(31, 168, 102, 0.06);
    }

    /* Alert Banner */
    .alert-banner {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .alert-error {
      background: rgba(201, 42, 55, 0.08);
      border: 1px solid var(--data-crimson);
      color: var(--data-crimson);
    }

    .alert-success {
      background: rgba(31, 168, 102, 0.10);
      border: 1px solid var(--accent-1);
      color: var(--accent-1);
    }

    /* Footer Security */
    .security-footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      max-width: 480px;
    }

    .return-link {
      margin-top: 1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .return-link:hover {
      color: var(--accent-1);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="login-container">
    <div class="brand-header">
      <img src="easygrow-logo-light.png" alt="EasyGrow" style="width: 58px; height: 58px; border-radius: 14px; margin: 0 auto 0.75rem; display: block; border: 1.5px solid #111111; background: #F8F8F6; padding: 6px; box-shadow: 0 8px 20px rgba(17, 17, 17, 0.08);" />
      <div class="brand-title">
        Easy<span>Grow</span>
      </div>
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">
        Consola de Negocios & Red Dropi
      </div>
      <div class="security-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Ciberseguridad Bancaria • RBAC
      </div>
    </div>

    <div class="auth-tabs">
      <button class="tab-btn active" id="tab-login-btn" onclick="switchTab('login')">
        Iniciar Sesión
      </button>
      <button class="tab-btn" id="tab-register-btn" onclick="switchTab('register')">
        Crear Cuenta de Negocio
      </button>
    </div>

    <div id="alert-box" class="alert-banner"></div>

    <!-- Login Form -->
    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Correo Electrónico</label>
        <div class="input-wrapper">
          <input type="email" id="login-email" class="form-control" placeholder="admin@easygrow.co o tu correo..." required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="btn-login-submit" class="btn-submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Acceder a la Consola
      </button>
    </form>

    <!-- Register Form -->
    <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="reg-company">Nombre de tu Empresa / Tienda</label>
        <input type="text" id="reg-company" class="form-control" placeholder="Ej: NovaStore Colombia" required>
      </div>

      <div class="form-group">
        <label for="reg-name">Nombre del Propietario / Gerente</label>
        <input type="text" id="reg-name" class="form-control" placeholder="Ej: Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="reg-email">Correo Electrónico Comercial</label>
        <input type="email" id="reg-email" class="form-control" placeholder="tu@empresa.co" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Contraseña Segura (Mínimo 8 caracteres)</label>
        <input type="password" id="reg-password" class="form-control" placeholder="••••••••••••" required minlength="8">
      </div>

      <button type="submit" id="btn-reg-submit" class="btn-submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
        Crear Negocio e Iniciar CRM ($0 Inicial)
      </button>
    </form>

    <div class="demo-accounts">
      <div class="demo-accounts-title">Acceso rápido para demostración y evaluación:</div>
      <div class="demo-pills">
        <button type="button" class="demo-pill" onclick="quickFillAdmin()">
          👑 Admin Maestro (admin@easygrow.co)
        </button>
      </div>
    </div>
  </div>

  <a href="index.html" class="return-link">← Volver a la Portada Principal</a>

  <div class="security-footer">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>Bcrypt 10 rounds • Cookies HTTP-Only • Aislamiento Multitenant Estricto</span>
  </div>

  <script>
    function showAlert(msg, isError = true) {
      const box = document.getElementById('alert-box');
      box.className = 'alert-banner ' + (isError ? 'alert-error' : 'alert-success');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('alert-box').style.display = 'none';
    }

    function switchTab(mode) {
      hideAlert();
      const tabLogin = document.getElementById('tab-login-btn');
      const tabReg = document.getElementById('tab-register-btn');
      const formLogin = document.getElementById('form-login');
      const formReg = document.getElementById('form-register');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
        formLogin.style.display = 'block';
        formReg.style.display = 'none';
      } else {
        tabLogin.classList.remove('active');
        tabReg.classList.add('active');
        formLogin.style.display = 'none';
        formReg.style.display = 'block';
      }
    }

    function quickFillAdmin() {
      switchTab('login');
      document.getElementById('login-email').value = 'admin@easygrow.co';
      document.getElementById('login-password').value = 'Admin123*!';
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const submitBtn = document.getElementById('btn-login-submit');

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Verificando credenciales...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          showAlert('Acceso autorizado. Redirigiendo a la consola...', false);
          setTimeout(() => {
            window.location.href = '/console.html';
          }, 400);
        } else {
          showAlert(data.error || 'Credenciales inválidas.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Acceder a la Consola';
        }
      } catch (err) {
        showAlert('Error de conexión con el servidor.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Acceder a la Consola';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();
      const companyName = document.getElementById('reg-company').value;
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const submitBtn = document.getElementById('btn-reg-submit');

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Creando espacio multitenant...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyName, name, email, password })
        });
        const data = await res.json();

        if (data.success) {
          showAlert('Negocio registrado con éxito. Redirigiendo a tu CRM nuevo...', false);
          setTimeout(() => {
            window.location.href = '/console.html';
          }, 500);
        } else {
          showAlert(data.error || 'No se pudo crear la cuenta.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Crear Negocio e Iniciar CRM ($0 Inicial)';
        }
      } catch (err) {
        showAlert('Error de comunicación con el servidor.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Crear Negocio e Iniciar CRM ($0 Inicial)';
      }
    }
  </script>
  <script src="js/loader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.EasyGrowLoader) {
        const loader = new window.EasyGrowLoader();
        loader.init();
      }
    });
  </script>
</body>
</html>
